name: Build DYStorage

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Check Theos cache
        run: |
          echo "upstream_heads=$(git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1)-$(git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1)" >> "$GITHUB_ENV"

      - name: Use Theos cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Remove unused Homebrew taps
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set incrementing package version
        run: |
          base_version="$(awk -F': ' '$1 == "Version" { print $2; exit }' control)"
          base_prefix="${base_version%.*}"
          build_version="${base_prefix}.${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^Version:.*/Version: ${build_version}/" control
          sed -i '' -E "s#kDYStorageVersion = @\"[^\"]*\"#kDYStorageVersion = @\"${build_version}\"#" Tweak.xm
          echo "Building DYStorage version ${build_version}"

      - name: Clean packages directory
        run: rm -rf packages && mkdir -p packages

      - name: Build Rootful
        run: |
          make package SCHEME=rootful FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootful.deb"
          done

      - name: Build Rootless
        run: |
          make package SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done

      - name: Build Roothide
        run: |
          make package SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-roothide.deb"
          done

      - name: Prepare package metadata
        id: package
        run: |
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read package version from control" >&2
            exit 1
          fi
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Deb packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb_files=(packages/*.deb)
          if [ "${#deb_files[@]}" -ne 3 ]; then
            echo "Expected 3 Deb packages, found ${#deb_files[@]}:" >&2
            printf '  %s\n' "${deb_files[@]}" >&2
            exit 1
          fi

          for scheme in rootful rootless roothide; do
            scheme_files=(packages/*-"${scheme}".deb)
            if [ "${#scheme_files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${scheme} package, found ${#scheme_files[@]}" >&2
              exit 1
            fi
          done

          printf 'Package artifact: %s\n' "${deb_files[@]}"

      - name: Extract arm64 dylib
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: bash .github/scripts/extract-release-dylib.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DYStorage-${{ steps.package.outputs.timestamp }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib
          if-no-files-found: error
