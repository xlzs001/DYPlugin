name: Build Theos Tweak

on:
  push:
    branches:
      - main
    paths:
      - 'control'
  pull_request:
    branches:
      - main
    paths:
      - 'control'
  workflow_dispatch:

jobs:
  build:
    name: Build DYPluginMgr
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1

      - name: Rename Package with Version
        run: |
        
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          echo "检测到当前版本号: $VERSION"
          
        
          mkdir -p output_packages
          
        
          for file in packages/*.deb; do
            filename=$(basename "$file")
         
            newname="${filename%.deb}_${VERSION}.deb"
            cp "$file" "output_packages/$newname"
            echo "已重命名为: $newname"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYPluginMgr-Packages
          path: output_packages/*.deb
