name: Build DYStorage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Check Theos cache
        run: |
          echo "upstream_heads=$(git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1)-$(git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1)" >> "$GITHUB_ENV"

      - name: Use Theos cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set incrementing package version
        run: |
          base_version="$(awk '/^Version:/ { print $2; exit }' control)"
          base_prefix="${base_version%.*}"
          build_version="${base_prefix}.${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^Version:.*/Version: ${build_version}/" control
          sed -i '' -E "s#kDYStorageVersion = @\"[^\"]*\"#kDYStorageVersion = @\"${build_version}\"#" Tweak.xm
          echo "Building DYStorage version ${build_version}"

      - name: Build package
        run: |
          rm -rf .theos packages output_packages
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Stage versioned package
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package_file"
          mkdir -p output_packages
          cp packages/*.deb output_packages/

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: DYStorage-Packages
          path: output_packages/*.deb
          if-no-files-found: error
